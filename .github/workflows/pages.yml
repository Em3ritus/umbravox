name: Build legacy web preview (no deployment)

# Historical ESP Web Tools preview only. The public native installer is served
# from gh-pages; see docs/RELEASE-MAINTENANCE.md. This workflow cannot deploy it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the pinned emscripten version
        id: emsdk
        run: echo "version=$(tr -d '[:space:]' < tools/emsdk-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache
      - name: Build the designer's WebAssembly preview
        run: bash tools/build-designer-wasm.sh
      - name: Designer tests
        run: npm test
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool>=5"
      - name: Build firmwares and assemble flasher
        run: bash tools/make-web-flasher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-web-preview
          path: web/dist
