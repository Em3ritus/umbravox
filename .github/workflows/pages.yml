name: Deploy web flasher

# Builds the three firmwares, merges each into a single browser-flashable image,
# and publishes the ESP Web Tools flasher (web/) to GitHub Pages. Enable Pages
# in the repo settings with "Source: GitHub Actions" for this to deploy.
on:
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - "device/**"
      - "ui/**"
      - "platformio.ini"
      - "tools/make-web-flasher.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool>=5"
      - name: Build firmwares and assemble flasher
        run: bash tools/make-web-flasher.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
