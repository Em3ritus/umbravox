name: CI

# Host tests (including the AddressSanitizer BLE parser test) and a build of
# legacy and native device firmwares, on every push and pull request. The `regress`
# target is not run here: its render baseline lives in private/, which is
# gitignored, so it only runs on a developer's machine.
on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the host test suite
        run: make -C sim test

  designer-tests:
    name: Designer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the pinned emscripten version
        id: emsdk
        run: echo "version=$(tr -d '[:space:]' < tools/emsdk-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache
      - name: Build the WebAssembly preview
        run: bash tools/build-designer-wasm.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # after emscripten: its setup puts its own python first on PATH, where pip's packages are invisible to python3 -I
      - name: Install Pillow (the gif2radar selftest needs it)
        run: python3 -m pip install pillow
      - name: Run the designer tests
        run: npm test

  installer-tests:
    name: Native installer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/native/test/*.test.mjs
      - run: python3 tools/test_assemble_native_installer.py
      - run: python3 tools/test_package_firmware.py

  device-build:
    name: Build ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [nm-cyd-c5, nm-c5-node, nm-c5-coordinator, ws-c5-35-engine, ws-c5-28-engine, nm-cyd-c5-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
