name: Release

# Manual. Builds the four installable boards from the commit this runs on, packages each as a ZIP
# (tools/package-firmware.py), assembles the browser installer from those ZIPs
# (tools/assemble-native-installer.py), publishes a GitHub release holding the ZIPs, then deploys the
# installer to GitHub Pages. Run it from main, on the commit you have tested on hardware:
#   Actions > Release > Run workflow, enter the tag (for example v1.1.0).
# A successful build is not hardware acceptance (docs/RELEASE-MAINTENANCE.md). The release is created as a
# pre-release unless you untick that box. "Dry run" (ticked by default) stops after the installer site is
# assembled: nothing is released and nothing is deployed. Do a dry run first, then run it again with the box unticked.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on this commit, e.g. v1.1.0"
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
      dry_run:
        description: "Dry run: build, package and assemble only; do not release or deploy"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Tests before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The tag is unused and well formed
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "tag must look like v1.2.3 (got '$TAG')"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "tag $TAG already exists"; exit 1; fi
      - run: make -C sim test
      - run: node --test web/native/test/*.test.mjs
      - run: python3 tools/test_assemble_native_installer.py
      - run: python3 tools/test_package_firmware.py

  package:
    name: Package ${{ matrix.environment }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        environment: [nm-cyd-c5, ws-c5-35-engine, ws-c5-28-engine, xiao-c5-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Package
        run: python3 tools/package-firmware.py ${{ matrix.environment }} .pio/build/${{ matrix.environment }} dist --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.environment }}
          path: dist/*.zip
          if-no-files-found: error

  site:
    name: Assemble the installer
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Assemble (this verifies every package's checksums and limits)
        run: |
          python3 tools/assemble-native-installer.py site \
            dist/umbravox-nm-cyd-c5.zip dist/umbravox-ws-c5-35-engine.zip \
            dist/umbravox-ws-c5-28-engine.zip dist/umbravox-xiao-c5-node.zip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the pinned emscripten version
        id: emsdk
        run: echo "version=$(tr -d '[:space:]' < tools/emsdk-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache
      - name: Build the theme designer's WebAssembly preview
        run: bash tools/build-designer-wasm.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # after emscripten: its setup puts its own python first on PATH, where pip's packages are invisible to python3 -I
      - name: Install Pillow (the gif2radar selftest needs it)
        run: python3 -m pip install pillow
      - name: Test and add the theme designer (served at /designer/)
        run: |
          npm test
          bash tools/assemble-designer.sh site
      - name: Re-list the whole site (installer and designer) in SITE-SHA256SUMS.txt
        run: |
          cd site
          find . -type f ! -name SITE-SHA256SUMS.txt | sed 's#^\./##' | LC_ALL=C sort | xargs -d '\n' sha256sum > SITE-SHA256SUMS.txt
      - name: Check the site inventory
        run: |
          cd site && sha256sum --check --quiet SITE-SHA256SUMS.txt
          test -f designer/index.html && test -f designer/wasm/uv_preview.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Keep the packages for inspection (dry runs download these)
        uses: actions/upload-artifact@v4
        with:
          name: assembled-site-and-zips
          path: |
            site/SITE-SHA256SUMS.txt
            dist/*.zip
          retention-days: 7

  release:
    name: Publish the GitHub release
    needs: site
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flag=""; [ "$PRERELEASE" = "true" ] && flag="--prerelease"
          cat > notes.md <<NOTES
          Firmware packages for the four installable boards, built from commit ${GITHUB_SHA} by the Release workflow.
          Each ZIP holds the four images the installer writes, manifest.json, SHA256SUMS.txt and a source snapshot of this commit.
          Install in your browser: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/

          A successful build is not hardware acceptance; see docs/RELEASE-MAINTENANCE.md for what has been tested on boards.
          NOTES
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "UMBRAVOX $TAG" --notes-file notes.md $flag

  deploy:
    name: Deploy the installer to Pages
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
