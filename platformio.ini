; NM-CYD-C5 -- ESP32-C5, 2.8" 320x240 ST7789, XPT2046 touch, CH340 UART.
;
; The platform is pioarduino, not the stock `espressif32`: ESP32-C5 silicon
; needs ESP-IDF 5.5+ / arduino-esp32 3.3+, and the official platform does not
; carry it. Version is pinned because this is the one RockBase validates
; against for this board.
;
; Arduino_GFX rather than Adafruit_GFX or TFT_eSPI: it is the library
; RockBase's own reference uses on this board, it has real C5 support, and
; TFT_eSPI would need a hand-written Processors/ port for the chip.
[platformio]
src_dir = device

; Flags every C5 board shares. Each board env adds its own -D board select
; and its console routing on top.
[c5]
build_flags =
    ; Both C5 boards carry 8MB of PSRAM that the DevKitC board definition
    ; does not assume. The dedup tables are the natural tenant: touched once
    ; per packet, never in the draw path.
    -DBOARD_HAS_PSRAM
    ; Mesh network id. 0 (the default) is the open/stock network every stock
    ; build shares. To run your own fleet with no crosstalk when other setups
    ; are in the same room, UNCOMMENT the next line with your own 1..255 value
    ; -- it is inherited by every env, so one edit flips the whole fleet.
    ; Rebuild and reflash every board to the same id. It is not a secret
    ; (readable in the binary); it isolates, it does not authenticate.
    ; -DMESH_NETID=42
    ; Make a printf format/argument mismatch a build failure rather than a
    ; null-pointer crash at run time.
    -Wformat=2
    -Werror=format
    ; An unhandled enum in a switch is a silent blank on screen, not a crash.
    -Werror=switch
    -I$PROJECT_DIR/ui

[env:nm-cyd-c5]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board     = esp32-c5-devkitc-1
framework = arduino
; Build-local BLE copy exposes existing callback-only storage; SDK stays untouched.
extra_scripts = pre:tools/ble_callback_library.py

board_upload.flash_size    = 16MB
board_upload.maximum_size  = 16777216
board_build.partitions     = huge_app.csv

; The board has a native USB-C *and* a CH340 UART port. We are on the CH340
; (/dev/ttyUSB0), so Serial must stay on UART0 -- CDC_ON_BOOT=1 would send it
; out the other connector and the console would look dead.
;
; -DNM_CYD_C5 selects this board's pins in device/board.h. The node and
; coordinator envs extend this one and inherit it; they never include board.h.
build_flags =
    ${c5.build_flags}
    -DNM_CYD_C5
    -DARDUINO_USB_CDC_ON_BOOT=0

; ui/ compiles for both PC and device; device/ is the entry point only.
; gps_probe.cpp is excluded explicitly -- it carries its own setup()/loop()
; and belongs to [env:gps-probe] alone.
; Each alternate firmware carries its own setup()/loop(), so the Core build
; has to exclude them by name. A bare +<*.cpp> silently links two mains.
build_src_filter = +<*.cpp> -<gps_probe.cpp> -<node_main.cpp> -<coord_main.cpp> +<../ui/*.cpp>

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.5

upload_port  = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Hardware probe, not part of the firmware. Sweeps the GPS header for a
; talking receiver, then reports fix progress until reset.
[env:gps-probe]
extends = env:nm-cyd-c5
build_src_filter = +<gps_probe.cpp>

; Headless collection node. No display, no touch, no GPS -- a radio and a
; buffer, reporting to the Core over ESP-NOW.
[env:nm-c5-node]
extends = env:nm-cyd-c5
; The node needs the shared parsers it actually calls -- not the UI, but
; not nothing either. A bare +<node_main.cpp> links until the day the node
; starts using something from ui/, and then fails at link rather than build.
build_src_filter = +<node_main.cpp> +<active_discovery.cpp> +<../ui/wifi_auth.cpp>
lib_deps =
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; The WCH-bridge C5 boards choke renegotiating the UART up to 460800, so pin
; the flasher to a speed they hold ([[technomancer-platform-scope]]).
upload_speed = 115200

; Coordinator -- the middle tier. Runs meshcore for its own cluster on a band
; slice and forwards ClusterBatch frames to the CYD. Headless like the node.
; It never calls cap::begin(), so the dedup table is never allocated; capture
; (and the parsers it links) are here only to satisfy meshcore's cap::ingest
; default, which the coordinator overrides with its own fold sink.
[env:nm-c5-coordinator]
extends = env:nm-c5-node
build_src_filter = +<coord_main.cpp> +<active_discovery.cpp> +<meshcore.cpp> +<capture.cpp> +<gpstrack.cpp> +<../ui/wifi_auth.cpp> +<../ui/signatures.cpp> +<../ui/gnss.cpp>
upload_speed = 115200

; Waveshare ESP32-C5-Touch-LCD-3.5 -- the same C5 and the same UI, a different
; board around it: 3.5" 480x320 ST7796, FT6336 capacitive touch on I2C, the
; backlight and panel/touch resets on a CH32V00x I/O expander, and an AXP2101
; PMU for the battery. Pins and the differences are in device/board.h.
;
; The board has only the native USB-C (USB-Serial-JTAG), so the console goes
; there: CDC_ON_BOOT=1. (On macOS the port is /dev/cu.usbmodem*; pass
; --upload-port.)
[env:ws-c5-35]
extends = env:nm-cyd-c5
build_flags =
    ${c5.build_flags}
    -DWS_C5_35
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env:nm-cyd-c5.lib_deps}
    lewisxhe/XPowersLib @ ^0.3.3
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; esptool's stub flasher faults (Guru Meditation, illegal instruction) when it
; renegotiates up to 460800 on this board, the same C5 behaviour the node envs
; pin around. Over USB-Serial-JTAG the number is nominal anyway.
upload_speed = 115200

; Waveshare 3.5" with the native-resolution SCAN engine opted in. A compile /
; prototype target only: without this opt-in the default [env:ws-c5-35] build
; selects the canvas renderer and carries none of the adapter. That is not a
; byte-for-byte claim -- shared WS code did change for the engine (touch::Point
; gained panelX/panelY, stripTick gained a force flag); the default build passes
; with the canvas renderer selected, not asserted bit-identical. With the opt-in,
; the SCAN screen is composed across the whole 480x320 panel in bounded strips
; (ui/scan_render.h + ui/scan_present.h + device/scan_adapter.cpp), with no 2x
; canvas and no letterbox. Not flashed in this increment; hardware is a later gate.
[env:ws-c5-35-engine]
extends = env:ws-c5-35
; Superseded single-screen adapter is not used by the all-screen engine.
build_src_filter = ${env:nm-cyd-c5.build_src_filter} -<scan_adapter.cpp>
build_flags =
    ${env:ws-c5-35.build_flags}
    -DUMBRAVOX_SCAN_ENGINE

; Headless C5 node using native USB, with the same coordinator-controlled scan policy.
[env:c5-usb-node]
extends = env:nm-c5-node
build_flags =
    ${c5.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; XIAO ESP32-C5: native USB, 8 MB flash. Radio-only node uses no board GPIOs.
; Keep the existing under-4MB partition layout and the shared node protocol.
[env:xiao-c5-node]
extends = env:c5-usb-node
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Waveshare 2.8: ST7789 + CST3530, native 320x240 engine.
[env:ws-c5-28-engine]
extends = env:ws-c5-35-engine
build_flags =
    ${c5.build_flags}
    -DWS_C5_28
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUMBRAVOX_SCAN_ENGINE
lib_deps = ${env:nm-cyd-c5.lib_deps}
